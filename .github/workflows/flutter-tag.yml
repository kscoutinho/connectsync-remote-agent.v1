name: ConnectSync V1 Stable Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'connectsync/v1.0.0-branding'

permissions:
  contents: write

jobs:
  run-connectsync-v1-release:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "connectsync-v1.0.0"
      prerelease: false
