name: ConnectSync V1.1 Laboratory Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'connectsync/v1.1-dual-code'

permissions:
  contents: write

jobs:
  run-connectsync-v1-1-lab-release:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "connectsync-v1.1.0-lab.1"
      prerelease: true
