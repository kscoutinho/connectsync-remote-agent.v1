name: ConnectSync V1.3 Quick Support Laboratory Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'connectsync/v1.3-quick-support'

permissions:
  contents: write

jobs:
  run-connectsync-v1-3-quick-support-lab-release:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "connectsync-v1.3.0-lab.1"
      prerelease: true
